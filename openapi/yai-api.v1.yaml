paths:
  /v1/operations:
    get:
      tags: [system]
      operationId: operations.list
      summary: List registered operations
      responses:
        '200':
          description: Operation registry listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  operations:
                    type: array
                    items:
                      type: string
  /v1/operations/{operation_id}:
    get:
      tags: [system]
      operationId: operations.show
      summary: Show operation metadata
      parameters:
        - in: path
          name: operation_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Operation metadata
          content:
            application/json:
              schema:
                type: object
  /v1/families:
