[package]
name = "yai-sdk-rust"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-YAI-Community"
description = "YAI Rust SDK transport-bound client surfaces"

[lib]
name = "yai_sdk_rust"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
